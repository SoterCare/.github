name: 🐛 Bug Report
description: Report something that's broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
  - type: input
    attributes:
      label: Environment
      placeholder: "e.g. browser/OS, or device model"
